<!-- Render templates. Styles: css/result.css
     ==========================================================================
     THE RULE THIS FILE EXISTS TO ENFORCE.

     Every user-visible sentence on a result comes from the API response.
     check.js is a renderer, not an interpreter: it clones one of these
     templates and writes response text into the [data-slot] elements. It never
     builds a Dutch sentence, never shortens one, and never decides what a
     result means.

     So the Dutch in THIS file is chrome only — headings, field labels, and the
     transport-level messages for failures that happen before any response
     exists. None of it is a statement about the law or about an address. If a
     result ever needs a sentence that is not in the response, the API is
     missing it; it does not get written here.

     Slot names are the response's own field names on purpose, so a slot cannot
     drift from what it renders.
     ========================================================================== -->

<!-- ---- The result shell ------------------------------------------------- -->
<template id="tpl-result">
  <section class="result">
    <!-- The RESOLVED address is the heading, and what was typed sits under it.
         A typo that is itself a real address passes every check the server can
         make, so the only thing that catches it is the user reading which house
         we answered about. That has to be the most prominent line here. -->
    <header class="result__head">
      <p class="eyebrow">Uitkomst voor</p>
      <h2 class="result__address" data-slot="address_resolved"></h2>
      <p class="result__asked note" data-slot="address-resolved-line" hidden>
        U vroeg naar <span data-slot="address_query"></span>. Klopt het adres
        hierboven niet, controleert u dan postcode en huisnummer.
      </p>
      <p class="result__where note" data-slot="gemeente-line" hidden>
        Gemeente <span data-slot="gemeente"></span>
        (<span data-slot="gemeentecode"></span>)
      </p>
    </header>

    <!-- The disclaimer is a FIELD of the response, so it renders on the result
         itself rather than in a page footer someone can scroll past. -->
    <aside class="disclosure disclosure--disclaimer">
      <h3 class="disclosure__title">Lees dit eerst</h3>
      <p data-slot="disclaimer"></p>
    </aside>

    <section class="disclosure disclosure--presumptions" data-slot="presumptions-block" hidden>
      <h3 class="disclosure__title">Aannames die wij hebben gedaan</h3>
      <div class="disclosure__items" data-slot="presumptions"></div>
    </section>

    <section class="disclosure disclosure--exclusions" data-slot="exclusions-block" hidden>
      <h3 class="disclosure__title">Buiten toepassing gelaten op uw eigen opgave</h3>
      <div class="disclosure__items" data-slot="declared_exclusions"></div>
    </section>

    <!-- What the previous answers resolved. Renders only after a re-check, and
         only when something actually moved out of "nog open — dit kunt u zelf
         beantwoorden" into "wat wij hebben kunnen toetsen". The rule ids and
         descriptions are the response's; the two sentences are chrome. -->
    <section class="changed" data-slot="changed-block" hidden>
      <h3 class="changed__title">Wat uw antwoorden hebben opgelost</h3>
      <p class="changed__note">
        Deze punten stonden bij de vorige uitkomst nog open en zijn nu getoetst.
        Wat de toets oplevert, staat hieronder bij de activiteit zelf.
      </p>
      <ul class="changed__list" data-slot="changed"></ul>
    </section>

    <div class="result__activities" data-slot="activities"></div>

    <!-- The answer form. ONE form for the whole result, not one per activity:
         facts are request-scoped, so the same question under two activities would
         be two controls for one fact and would let a user contradict themselves
         inside a single submit. The questions come from the union of every
         activity's `open_questions`, deduped by question id. -->
    <section class="answers" data-slot="answers-block" hidden>
      <h3 class="answers__title">Beantwoord wat u zelf kunt beantwoorden</h3>
      <p class="answers__note">
        Wij bewaren deze antwoorden nergens — niet in uw browser, niet in een
        cookie, niet in de link. Ververst u de pagina, dan zijn ze weg en begint
        de scan opnieuw bij het adres.
      </p>
      <form class="answers__form" data-slot="answers-form" novalidate>
        <div class="answers__list" data-slot="questions"></div>
        <!-- Shown when the service refused the answers. The per-question message
             is the API's own and sits on the field that caused it; this line only
             says that nothing was tested. -->
        <p class="answers__error" data-slot="answers-error" role="alert" hidden>
          Er is niets getoetst: een of meer antwoorden zijn niet aanvaard. Wat er
          per vraag mis is, staat bij die vraag. Uw antwoorden staan er nog.
        </p>
        <!-- 429 / 503 on a re-check. The service's own sentence, shown HERE
             rather than in place of the result, because replacing the result
             would take the user's answers with it — and being locked out of
             your own form for ten minutes is the failure batching exists to
             avoid in the first place. -->
        <p class="answers__service" data-slot="answers-service" role="alert" hidden></p>
        <button type="submit" class="btn btn--primary answers__submit" data-slot="answers-submit">
          Uitkomst bijwerken
        </button>
        <p class="answers__budget note">
          Wij versturen al uw antwoorden in één keer. Elke controle telt mee voor
          een limiet van vijf per tien minuten.
        </p>
      </form>
    </section>

    <section class="disclosure disclosure--caveats" data-slot="caveats-block" hidden>
      <h3 class="disclosure__title">Kanttekeningen bij de gebruikte gegevens</h3>
      <ul class="caveats" data-slot="caveats"></ul>
    </section>
  </section>
</template>

<template id="tpl-changed-item">
  <li class="changed-item">
    <span class="changed-item__rule" data-slot="rule_id"></span>
    <span data-slot="description"></span>
  </li>
</template>

<!-- ---- One question on the answer form ----------------------------------
     `text`, `promise` and every choice label come from the response. The only
     Dutch below is the rejection prefix, and even that is a label, not a claim:
     the message beside it is the server's own.

     `promise` is not decoration. It is what stops a bucket-C question — one that
     needs our answer AND a source we do not have — from reading as "answer this
     and you will know". The response says which it is; this renders it. -->
<template id="tpl-answer">
  <fieldset class="answer" data-slot="answer">
    <legend class="answer__text" data-slot="text"></legend>
    <p class="answer__promise" data-slot="promise"></p>
    <div class="answer__control" data-slot="control"></div>
    <div class="answer__subs" data-slot="sub_questions" hidden></div>
    <p class="answer__rejection" data-slot="rejection" role="alert" hidden>
      <span class="answer__rejection-fact" data-slot="fact"></span>
      <span data-slot="message"></span>
    </p>
  </fieldset>
</template>

<!-- A sub-question. `role` decides whether it is a gate, the fact itself, or a
     dossier note; the renderer reads that from the response and never from the
     wording. The scope gate is the legally load-bearing one — a permit for a
     dakkapel is not a permit for the woningvorming. -->
<template id="tpl-answer-sub">
  <fieldset class="answer answer--sub" data-slot="answer">
    <legend class="answer__text" data-slot="text"></legend>
    <div class="answer__control" data-slot="control"></div>
  </fieldset>
</template>

<template id="tpl-answer-choice">
  <label class="choice">
    <input type="radio" class="choice__input" data-slot="input" />
    <span class="choice__label" data-slot="label"></span>
  </label>
</template>

<template id="tpl-answer-scalar">
  <input class="answer__input" data-slot="input" autocomplete="off" />
</template>

<template id="tpl-presumption">
  <article class="disclosure-item">
    <p class="disclosure-item__statement" data-slot="statement"></p>
    <p class="disclosure-item__consequence" data-slot="consequence"></p>
    <p class="citation" data-slot="citation"></p>
  </article>
</template>

<template id="tpl-exclusion">
  <article class="disclosure-item">
    <p class="disclosure-item__statement" data-slot="statement"></p>
    <p class="disclosure-item__consequence" data-slot="consequence"></p>
    <p class="citation" data-slot="citation"></p>
  </article>
</template>

<template id="tpl-caveat">
  <li class="caveat"><span data-slot="text"></span></li>
</template>

<!-- ---- One activity ------------------------------------------------------
     No three-step meter. `likely` is unreachable while the omgevingsplan layer
     is unencoded, so a three-step scale would show the user a step they cannot
     reach and read as "u haalde het niet". The verdict is a label and a
     sentence, both from the response.

     The verdict card carries NO tone colour. Tone is a property of a cited
     rule entry, and the response gives none for the aggregate; colouring the
     aggregate would mean this page deciding what the verdict means. Severity
     shows up where it is actually grounded — on the blocking entry below. -->
<template id="tpl-activity">
  <section class="activity">
    <h3 class="activity__name"><span data-slot="activity"></span></h3>

    <div class="verdict">
      <p class="verdict__label" data-slot="verdict_label"></p>
      <p class="verdict__statement" data-slot="verdict_statement"></p>
    </div>

    <section class="bucket bucket--a" data-slot="bucket-decided" hidden>
      <h4 class="bucket__title">Wat wij hebben kunnen toetsen</h4>
      <div class="bucket__items" data-slot="decided"></div>
    </section>

    <section class="bucket bucket--b" data-slot="bucket-user" hidden>
      <h4 class="bucket__title">Nog open — dit kunt u zelf beantwoorden</h4>
      <p class="bucket__note">
        Dit zijn geen goedgekeurde punten. Zolang het antwoord ontbreekt, is dit
        punt niet getoetst.
      </p>
      <div class="bucket__items" data-slot="needs_user_input"></div>
    </section>

    <section class="bucket bucket--c" data-slot="bucket-source" hidden>
      <h4 class="bucket__title">Nog open — hiervoor ontbreekt ons een bron</h4>
      <p class="bucket__note">
        Dit zijn geen goedgekeurde punten. Deze punten kunt u niet zelf
        oplossen; wij hebben er geen gegeven voor.
      </p>
      <div class="bucket__items" data-slot="needs_external_source"></div>
    </section>

    <!-- The ceiling renders AFTER the buckets, never above them. On an
         `unlikely` verdict the binding constraint is a real, cited refusal
         ground in bucket A — putting a ceiling notice above it would present
         a coverage gap as the reason the answer is negative. -->
    <aside class="ceiling" data-slot="ceiling-block" hidden>
      <h4 class="ceiling__title">Waarom een positieve uitkomst nu sowieso niet mogelijk is</h4>
      <p data-slot="verdict_ceiling_reason"></p>
    </aside>

    <p class="instrument note">
      <span data-slot="instrument_title"></span> ·
      <span data-slot="version_label"></span> ·
      <span class="instrument__corpus" data-slot="corpus_ref"></span>
    </p>
  </section>
</template>

<!-- ---- One evaluated rule ------------------------------------------------
     The tone class is written onto the root element by check.js from
     presentation.tone and from nothing else. -->
<template id="tpl-entry">
  <article class="entry">
    <div class="entry__rail" aria-hidden="true"></div>
    <div class="entry__body">
      <p class="entry__label" data-slot="presentation.label"></p>
      <p class="entry__statement" data-slot="presentation.statement"></p>
      <p class="entry__description" data-slot="description"></p>
      <p class="entry__unavailable" data-slot="unavailable_reason" hidden></p>
      <!-- The caveats bearing on THIS point, resolved server-side. A Blokkade
           whose basis is flagged uncertain must carry that flag where it is
           read; the summary list at the foot stays, for the caveats that bear on
           nothing in particular. -->
      <div class="entry__caveats" data-slot="entry-caveats" hidden>
        <p class="entry__caveats-title">Kanttekening bij dit punt</p>
        <ul data-slot="entry-caveats-list"></ul>
      </div>
      <div class="entry__questions" data-slot="questions" hidden>
        <p class="entry__questions-title">Wat wij hiervoor van u nodig hebben</p>
        <ul data-slot="questions-list"></ul>
      </div>
      <p class="citation">
        <span class="entry__rule-id" data-slot="rule_id"></span>
        <span data-slot="citation"></span>
      </p>
    </div>
  </article>
</template>

<template id="tpl-question">
  <li class="question" data-slot="prompt"></li>
</template>

<template id="tpl-entry-caveat">
  <li class="entry-caveat" data-slot="text"></li>
</template>

<!-- ---- status === "address_mismatch" ------------------------------------
     We resolved something, but not confidently what was asked for. No verdict,
     because showing one would be a legal statement about a house the user did
     not ask about — the failure this outcome exists to prevent.

     Both sentences come from `address_match`: the server distinguishes "this
     house number does not exist on this postcode" from "we found a different
     address", and picking between them here would be this page deciding what
     the server's evidence means. The only Dutch below is the button and the
     labels around the two addresses. -->
<template id="tpl-mismatch">
  <section class="result result--mismatch">
    <div class="statusbox statusbox--mismatch">
      <p class="statusbox__title" data-slot="statement"></p>
      <p class="statusbox__consequence" data-slot="consequence"></p>

      <div class="mismatch__found" data-slot="resolved-block" hidden>
        <p class="mismatch__found-label">Wij vonden dit adres:</p>
        <p class="mismatch__found-address" data-slot="address_resolved"></p>
        <button type="button" class="btn btn--ghost" data-slot="resubmit">
          Dit adres controleren
        </button>
      </div>

      <p class="mismatch__asked note">
        U vroeg naar <span data-slot="address_query"></span>.
      </p>
    </div>

    <aside class="disclosure disclosure--disclaimer">
      <h3 class="disclosure__title">Lees dit eerst</h3>
      <p data-slot="disclaimer"></p>
    </aside>

    <section class="disclosure disclosure--presumptions" data-slot="presumptions-block" hidden>
      <h3 class="disclosure__title">Aannames die wij hebben gedaan</h3>
      <div class="disclosure__items" data-slot="presumptions"></div>
    </section>

    <section class="disclosure disclosure--exclusions" data-slot="exclusions-block" hidden>
      <h3 class="disclosure__title">Buiten toepassing gelaten op uw eigen opgave</h3>
      <div class="disclosure__items" data-slot="declared_exclusions"></div>
    </section>

    <section class="disclosure disclosure--caveats" data-slot="caveats-block" hidden>
      <h3 class="disclosure__title">Kanttekeningen bij de gebruikte gegevens</h3>
      <ul class="caveats" data-slot="caveats"></ul>
    </section>
  </section>
</template>

<!-- ---- Non-`ok` outcomes -------------------------------------------------
     The three statuses that carry no activities. Since schema_version 3 the
     response supplies both sentences in `outcome`, so this template holds NO
     copy about the outcome at all — the three headings that used to live here
     were the last outcome text this page wrote for itself, and a page writing
     "wij konden dit adres niet vaststellen" is a page making a claim about our
     coverage that we never made. -->
<template id="tpl-status">
  <section class="result result--terminal">
    <header class="result__head">
      <p class="eyebrow">Uitkomst voor</p>
      <h2 class="result__address" data-slot="address_query"></h2>
    </header>

    <div class="statusbox">
      <p class="statusbox__title" data-slot="statement"></p>
      <p class="statusbox__consequence" data-slot="consequence"></p>

      <div class="statusbox__covered" data-slot="covered-block" hidden>
        <p class="statusbox__covered-title">Wel gedekt op dit moment:</p>
        <ul data-slot="covered_gemeenten"></ul>
      </div>
    </div>

    <aside class="disclosure disclosure--disclaimer">
      <h3 class="disclosure__title">Lees dit eerst</h3>
      <p data-slot="disclaimer"></p>
    </aside>

    <section class="disclosure disclosure--presumptions" data-slot="presumptions-block" hidden>
      <h3 class="disclosure__title">Aannames die wij hebben gedaan</h3>
      <div class="disclosure__items" data-slot="presumptions"></div>
    </section>

    <section class="disclosure disclosure--exclusions" data-slot="exclusions-block" hidden>
      <h3 class="disclosure__title">Buiten toepassing gelaten op uw eigen opgave</h3>
      <div class="disclosure__items" data-slot="declared_exclusions"></div>
    </section>

    <section class="disclosure disclosure--caveats" data-slot="caveats-block" hidden>
      <h3 class="disclosure__title">Kanttekeningen bij de gebruikte gegevens</h3>
      <ul class="caveats" data-slot="caveats"></ul>
    </section>
  </section>
</template>

<template id="tpl-covered">
  <li><span data-slot="gemeente"></span> — <span data-slot="activities"></span></li>
</template>

<!-- ---- HTTP 429 / 503 — the response carries its own Dutch message. -->
<template id="tpl-service">
  <section class="result result--message">
    <div class="statusbox statusbox--service">
      <p class="statusbox__title" data-slot="message"></p>
      <p class="statusbox__retry" data-slot="retry-line" hidden>
        Probeert u het over <span data-slot="retry_after_seconds"></span> seconden opnieuw.
      </p>
    </div>
  </section>
</template>

<!-- ---- HTTP 422 — a client bug. Each rejection carries its own message. -->
<template id="tpl-invalid">
  <section class="result result--message">
    <div class="statusbox statusbox--invalid">
      <p class="statusbox__title">
        Er is niets getoetst: de gegevens in deze aanvraag zijn niet aanvaard.
      </p>
      <ul class="rejections" data-slot="rejected"></ul>
    </div>
  </section>
</template>

<template id="tpl-rejection">
  <li class="rejection">
    <span class="rejection__fact" data-slot="fact"></span>
    <span data-slot="message"></span>
  </li>
</template>

<!-- ---- No response at all (network down, DNS, CORS, aborted, non-JSON body).
     The only place on this page where Dutch describes an outcome without the
     API — because there is no API answer to quote. It deliberately says
     nothing about the address. -->
<template id="tpl-transport">
  <section class="result result--message">
    <div class="statusbox statusbox--error">
      <p class="statusbox__title" data-error="network" hidden>
        Wij konden de server niet bereiken. Er is niets getoetst — dit zegt niets
        over uw adres. Controleert u uw verbinding en probeert u het opnieuw.
      </p>
      <p class="statusbox__title" data-error="unexpected" hidden>
        Er ging iets mis bij het ophalen van de uitkomst. Er is niets getoetst —
        dit zegt niets over uw adres.
      </p>
      <p class="statusbox__detail" data-slot="detail" hidden></p>
    </div>
  </section>
</template>

<!-- ---- The version guard --------------------------------------------------
     This page renders one specific version of the /api/check contract. When the
     service answers with a different `schema_version`, the page cannot know what
     its own slots now mean, so it shows this INSTEAD of the answer.

     The Dutch here is chrome, and it belongs to the same class as tpl-transport:
     a failure where we have no answer we are entitled to quote. A response we
     cannot interpret is not an answer — reading Dutch sentences out of a
     contract this page no longer understands is exactly the failure the guard
     exists to prevent, so it deliberately says nothing about the address.

     The two versions are shown because they are the only thing that makes the
     fault diagnosable from a screenshot. -->
<template id="tpl-version-mismatch">
  <section class="result result--message">
    <div class="statusbox statusbox--error">
      <p class="statusbox__title">
        Deze pagina en de dienst zijn niet meer op elkaar afgestemd. Er is niets
        getoetst — dit zegt niets over uw adres. Wij tonen liever niets dan een
        uitkomst die wij mogelijk verkeerd weergeven. Probeert u het later opnieuw.
      </p>
      <p class="statusbox__detail" data-slot="detail"></p>
    </div>
  </section>
</template>

<!-- ---- The render guard ---------------------------------------------------
     Shown INSTEAD of a result when a mandatory disclosure could not be placed.
     A result rendered without its presumptions or its carve-out disclosure is a
     false legal statement, so the page shows nothing rather than a partial. -->
<template id="tpl-render-failure">
  <section class="result result--message">
    <div class="statusbox statusbox--error">
      <p class="statusbox__title">
        Wij hebben deze uitkomst niet volledig kunnen weergeven en tonen hem
        daarom niet. Een uitkomst zonder de bijbehorende aannames en
        kanttekeningen zou een onjuist beeld geven.
      </p>
      <p class="statusbox__detail" data-slot="detail"></p>
    </div>
  </section>
</template>
