<!-- Final CTA — styles: css/cta.css
     NOT YET REVIEWED against the concept. -->
<section class="section final-cta-section">
  <div class="container final-cta">
    <div class="stack-lg final-cta__copy reveal">
      <h2 class="h2--loud">Ontdek wat er al in je woning verborgen zit</h2>
      <p class="lead">Binnen enkele minuten weet je waar kansen liggen voor een extra woning — en welke regels, risico's en vervolgstappen daarbij horen.</p>
      <form class="addresscheck" onsubmit="return false">
        <div class="addressbar">
          <div class="addressbar__field addressbar__field--postcode">
            <label for="pc2">Postcode</label>
            <input id="pc2" name="postcode" type="text" placeholder="1234 AB"
                   autocomplete="postal-code" maxlength="7" spellcheck="false" />
          </div>
          <span class="addressbar__sep" aria-hidden="true"></span>
          <div class="addressbar__field addressbar__field--number">
            <label for="hn2">Huisnummer</label>
            <input id="hn2" name="huisnummer" type="text" placeholder="12"
                   inputmode="numeric" maxlength="5" autocomplete="address-line2" />
          </div>
          <button class="btn btn--primary" type="submit">Check mijn adres</button>
        </div>
        <p class="note">Geen spam. Geen verplichtingen. Direct een eerste indicatie.</p>
      </form>
    </div>
    <div class="final-cta__visual">
      <div class="final-cta__map" aria-hidden="true"></div>
      <img class="final-cta__miniature reveal" src="../assets/miniatur.webp"
           alt="Isometrisch woningmodel met een gemarkeerde mogelijke extra wooneenheid"
           width="1448" height="1086" loading="lazy" />
    </div>
  </div>
</section>
