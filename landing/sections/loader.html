<!-- Initial page transition — styles: css/loader.css
     The animated mark is the supplied assets/extrawoning-loader.svg. -->
<div class="page-loader" data-page-loader role="status" aria-live="polite" aria-label="ExtraWoning wordt geladen">
  <div class="page-loader__stage">
    <span class="page-loader__halo" aria-hidden="true"></span>
    <img class="page-loader__mark" src="../assets/extrawoning-loader.svg"
         alt="" width="64" height="64" fetchpriority="high" />
    <p class="page-loader__status"><span aria-hidden="true"></span>Woningkansen worden geladen</p>
  </div>
</div>
