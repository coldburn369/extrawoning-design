# preview.extrawoning.nl — private preview vhost (HTTPS origin behind Cloudflare).
#
# OWNERSHIP MOVED HERE IN SLICE 1c. This file used to live in
# apps/woningkans/deploy/. It moved because the vhost now serves THIS repo's
# checkout, so the repo it points at is the repo that owns it. The copy still
# sitting in apps/woningkans/deploy/ is stale from this commit onward; deleting
# it is a one-line change over there, deliberately not made from here.
#
# Install / update (as a sudo user, from the design repo root):
#   sudo cp deploy/nginx-preview-extrawoning.conf /etc/nginx/sites-available/extrawoning-preview
#   sudo nginx -t && sudo systemctl reload nginx
# Drift check (this file must byte-match what is live):
#   diff deploy/nginx-preview-extrawoning.conf /etc/nginx/sites-available/extrawoning-preview
#
# ALWAYS `sudo nginx -t` FIRST. A bad config fails the reload for all seven
# vhosts on this box (leadhaus, chatbotx, igtracker, apex-dashboard, …), not
# just this one.
#
# The :80 -> :443 redirect for this host stays in sites-available/extrawoning-http.
# The apex (extrawoning.nl) is a SEPARATE vhost in sites-available/extrawoning-https
# and is never touched from this repo.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name preview.extrawoning.nl;

    # SERVED STRAIGHT FROM THE DESIGN CHECKOUT (slice 1c). /srv/extrawoning is a
    # symlink to /home/ubuntu/extrawoning, so this is the git working tree
    # itself: editing a file under design/ changes what is live on the next
    # refresh. There is no build step and no release artifact — deliberately,
    # because the alternative is a `python build.py` between every edit and a
    # preview that is always one step stale.
    #
    # Consequence to know before editing: a half-saved file IS the live page.
    # `dist/` is gitignored and is NOT what this serves.
    root /srv/extrawoning/design;
    index index.html;

    # The pages are authored as a shell plus per-section partials joined by
    #   <!--#include file="sections/hero.html" -->
    # which is nginx's own SSI directive — the same syntax serve.py and build.py
    # implement. Turning SSI on is therefore the whole of "no build step":
    # nginx resolves the includes on the fly, exactly as the dev server does.
    # `file=` resolves relative to the including document's directory, matching
    # build.py's semantics. Verified against /landing/ and /check/ after the
    # reload — do not take it on trust if you change the include layout.
    ssi on;

    # NOT OPTIONAL, and not a "quieten the logs" flag. landing/index.html marks
    # its stylesheet block with <!--#css-bundle-start--> / <!--#css-bundle-end-->
    # for build.py. Those are not SSI commands, but they LOOK like ones: nginx
    # parses `css` as the command, fails on the `-bundle-start` token, and — with
    # the default `off` — substitutes the literal string
    #     [an error occurred while processing the directive]
    # into the <head>, which the HTML parser then reparents into the body. That
    # is two lines of error text at the top of the live landing page.
    #
    # `on` makes nginx emit nothing for a directive it cannot process, so the
    # build markers pass through invisibly and the <link> tags between them are
    # untouched. build.py reads the file from disk, not through nginx, so
    # flattening for deploy still sees the markers and still works.
    #
    # The trade-off, stated plainly: a genuinely broken <!--#include --> now
    # renders as a missing section rather than an error string. That is covered
    # earlier and better — check.mjs fails on an include target that does not
    # exist, and so do serve.py and build.py.
    ssi_silent_errors on;

    ssl_certificate     /etc/ssl/extrawoning/origin.pem;
    ssl_certificate_key /etc/ssl/extrawoning/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /srv/extrawoning/logs/private.access.log;
    error_log  /srv/extrawoning/logs/private.error.log;

    auth_basic "ExtraWoning preview";
    auth_basic_user_file /etc/nginx/.htpasswd-extrawoning;

    # --- Real client IP behind Cloudflare ---------------------------------
    # Without this, $remote_addr is a Cloudflare edge IP (e.g. 162.158.95.242)
    # and every visitor looks like the same handful of addresses — which would
    # make slice 1a's per-IP rate limiter rate-limit Cloudflare, not users.
    # Cloudflare does NOT send X-Real-IP; it sends CF-Connecting-IP (and an
    # X-Forwarded-For that already holds the true client IP). CF-Connecting-IP
    # is the single-valued one, so it is the one we trust.
    #
    # Scoped to THIS server block on purpose: at http level these directives
    # would silently change $remote_addr for the six unrelated vhosts on this
    # box (leadhaus, chatbotx, igtracker, apex-dashboard, …), several of which
    # log or authorise on it.
    #
    # Ranges below: https://www.cloudflare.com/ips-v4 + ips-v6, fetched
    # 2026-07-25. Cloudflare adds ranges occasionally — refresh procedure and
    # its failure signature are in docs/operations/deploy.md.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # --- Security headers -------------------------------------------------
    # NOTE ON NGINX add_header INHERITANCE: a location block that sets ANY
    # add_header discards every add_header inherited from this server block.
    # Each location below therefore repeats the full set. Do not "tidy" that.
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
    # HSTS without includeSubDomains on purpose: this host is already HTTPS-only
    # (:80 redirects), but includeSubDomains would pin every *.extrawoning.nl —
    # including the apex — into forced HTTPS in browsers that have merely visited
    # this preview. That is not slice 0's call to make. No preload, for the same
    # reason: preload entries are slow and painful to unwind.
    add_header Strict-Transport-Security "max-age=15768000" always;
    # default-src 'self' as the baseline — which is what makes /check/ use an
    # external check.js rather than an inline <script>. Do not relax script-src.
    #
    # style-src still carries 'unsafe-inline', but for a smaller reason than it
    # used to. The slice-0 placeholder had a whole inline <style> block; the
    # design repo has no inline <style> at all. What remains is ONE inline
    # attribute: `style="position:absolute"` on the sprite <svg> in
    # landing/sections/sprites.html. Dropping the token today would silently
    # change the landing page, which is a concept under review and not this
    # slice's to touch. Move that attribute into a class and the token can go —
    # nothing else here needs to change.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # --- Static preview ---------------------------------------------------
    # The repo root has no index.html of its own — the pages live one level
    # down (/landing/, /check/). Send the bare host to the landing page rather
    # than to a 403.
    #
    # NOTE: no add_header here on purpose. A location that sets ANY add_header
    # discards every one inherited from the server block; setting none inherits
    # the full set. Same for the robots.txt location below.
    location = / {
        return 302 /landing/index.html;
    }

    # robots.txt stays where it has always lived, in the sites repo. Moving the
    # document root did not move that fact, and copying the file into the design
    # repo would give it two homes.
    location = /robots.txt {
        alias /srv/extrawoning/sites/private/robots.txt;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # --- API: liveness ----------------------------------------------------
    # Exact match, so /healthcheck or /health/foo do NOT land here — they fall
    # through to `location /` and stay behind basic auth.
    #
    # auth_basic off: /health must be pollable by uptime monitoring without
    # credentials. It returns exactly {"status":"ok"} and nothing else — no
    # version, no build id, no dependency status. Keep it that way; anything
    # richer belongs behind the auth.
    location = /health {
        auth_basic off;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    10s;

        # Re-stated because this location sets its own add_header (see note above).
        # default-src 'none' rather than 'self': this endpoint is JSON and must
        # never be allowed to pull a subresource.
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # --- API: application routes ------------------------------------------
    # Inherits `auth_basic` from the server block — i.e. /api/ is behind the
    # preview password, which is what we want until launch. Deleting the auth
    # means deleting it at the SERVER level, so decide deliberately. That basic
    # auth is currently the ONLY thing protecting /api/leads, an unauthenticated
    # write; see ADR-0012 before removing it.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;

        # THE rate-limit input. $remote_addr is the true client IP here because
        # of the `real_ip_header CF-Connecting-IP` block above; `proxy_set_header`
        # OVERRIDES any X-Real-IP a client tried to send, so the app receives
        # exactly one value that nginx controls. uvicorn runs with
        # --no-proxy-headers so nothing downstream can rewrite the peer either.
        # If this line is ever removed, the app does NOT silently fall back — it
        # fails closed into a single shared bucket.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        # Must exceed the app's own per-request budget (config
        # check_timeout_seconds, default 8 s) so the app returns its honest
        # `source_timeout` body rather than nginx returning a bare 504.
        proxy_read_timeout    15s;

        # Re-stated because this location sets its own add_header (see the note
        # at the top of this file). default-src 'none' rather than 'self': these
        # endpoints are JSON and must never pull a subresource.
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=15768000" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }
}
